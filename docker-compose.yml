services:
  hermes:
    build: .
    container_name: hermes_bsc
    restart: unless-stopped
    env_file:
      - .env
    stdin_open: true
    tty: true
    volumes:
      - hermes_data:/opt/data
    ports:
      - "127.0.0.1:9119:9119"
      - "127.0.0.1:8642:8642"
    environment:
      - HERMES_DASHBOARD=1

volumes:
  hermes_data:
